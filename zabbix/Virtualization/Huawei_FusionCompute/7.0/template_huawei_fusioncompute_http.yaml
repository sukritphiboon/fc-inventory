                req.addHeader('X-Auth-Token: ' + sess.token);
                var resp = req.get(abs(path));
                if (req.getStatus() !== 200) throw 'GET ' + path + ' failed: HTTP ' + req.getStatus();
                return JSON.parse(resp);
            }

            function getAll(sess, path, key) {
                var items = [];
                var offset = 0;
                var limit = 100;
                while (true) {
