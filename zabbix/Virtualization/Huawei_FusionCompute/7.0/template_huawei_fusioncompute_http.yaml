              master_item:
                key: fusioncompute.datastores
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.urn=="{#DS.URN}")].capacityGB.first()'
                - type: MULTIPLIER
                  parameters:
                    - '1073741824'
              tags:
                - tag: component
                  value: datastore
                - tag: datastore
                  value: '{#DS.NAME}'
            - uuid: e84de9086160409684528713318aea22
              name: 'Datastore [{#DS.NAME}]: Free space'
              type: DEPENDENT
              key: 'fusioncompute.datastore.free[{#DS.URN}]'
              value_type: FLOAT
              units: B
              master_item:
                key: fusioncompute.datastores
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.urn=="{#DS.URN}")].freeGB.first()'
                - type: MULTIPLIER
                  parameters:
                    - '1073741824'
              tags:
                - tag: component
                  value: datastore
                - tag: datastore
                  value: '{#DS.NAME}'
            - uuid: f679b3c827104f8faeabdc4c5b192c86
              name: 'Datastore [{#DS.NAME}]: Space used, %'
              type: DEPENDENT
              key: 'fusioncompute.datastore.pused[{#DS.URN}]'
              value_type: FLOAT
              units: '%'
              master_item:
                key: fusioncompute.datastores
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.urn=="{#DS.URN}")].usedPct.first()'
