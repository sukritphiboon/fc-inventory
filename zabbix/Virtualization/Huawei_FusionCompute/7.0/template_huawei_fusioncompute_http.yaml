      tags:
        - tag: class
          value: virtualization
        - tag: target
          value: huawei-fusioncompute
      macros:
        - macro: '{$FC.HOST}'
          value: '{HOST.CONN}'
          description: 'FusionCompute VRM address. Defaults to the host interface.'
        - macro: '{$FC.PORT}'
          value: '7443'
          description: 'FusionCompute VRM API port.'
        - macro: '{$FC.USER}'
          value: monitor
          description: 'Read-only FusionCompute user for monitoring.'
        - macro: '{$FC.PASSWORD}'
          type: SECRET_TEXT
          value: ''
          description: 'Password for {$FC.USER}.'
        - macro: '{$FC.API.VERSION}'
          value: v8.0
          description: 'Preferred API version tried first (falls back through v6.5, v6.3, v6.1, v1.0, v9.0).'
        - macro: '{$FC.AUTH.MODE}'
          value: plain
          description: 'Password auth mode: "plain" (X-ENCRYPT-ALGORITHM 1) or "sha256" (X-ENCRYPT-ALGORITHM 0).'
        - macro: '{$FC.DATA.TIMEOUT}'
          value: 30s
          description: 'Script item HTTP timeout.'
        - macro: '{$FC.LLD.FILTER.HOST.MATCHES}'
          value: '.*'
          description: 'Discover hosts whose name matches this regex.'
        - macro: '{$FC.LLD.FILTER.HOST.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Ignore hosts whose name matches this regex.'
        - macro: '{$FC.LLD.FILTER.VM.MATCHES}'
          value: '.*'
          description: 'Discover VMs whose name matches this regex.'
        - macro: '{$FC.LLD.FILTER.VM.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Ignore VMs whose name matches this regex.'
        - macro: '{$FC.LLD.FILTER.DATASTORE.MATCHES}'
          value: '.*'
          description: 'Discover datastores whose name matches this regex.'
        - macro: '{$FC.LLD.FILTER.DATASTORE.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'Ignore datastores whose name matches this regex.'
        - macro: '{$FC.DATASTORE.PUSED.MAX.WARN}'
          value: '80'
          description: 'Datastore used space warning threshold, %.'
        - macro: '{$FC.DATASTORE.PUSED.MAX.CRIT}'
          value: '90'
          description: 'Datastore used space critical threshold, %.'
      valuemaps:
        - uuid: c9001e50411041cfae1cb98722fbcd49
          name: 'FusionCompute host status'
          mappings:
            - value: '0'
              newvalue: Abnormal
            - value: '1'
              newvalue: Normal
        - uuid: 363cc3b989394ce2a68f8c1024983827
          name: 'FusionCompute VM power state'
          mappings:
            - value: '0'
              newvalue: 'Not running'
            - value: '1'
              newvalue: Running
        - uuid: 1e9c131d862b4f499137cf4efc15efe6
          name: 'FusionCompute datastore status'
          mappings:
            - value: '0'
              newvalue: Abnormal
            - value: '1'
              newvalue: Normal
        - uuid: f41460bc82f74545a46588b51e0b0254
          name: 'FusionCompute enabled state'
          mappings:
            - value: '0'
              newvalue: Disabled
            - value: '1'
              newvalue: Enabled
  triggers:
    - uuid: d6faef4ae969431fb651e18c692a23c2
      expression: 'last(/Huawei FusionCompute by HTTP/fusioncompute.available)=0 or nodata(/Huawei FusionCompute by HTTP/fusioncompute.available,15m)=1'
      name: 'FusionCompute: VRM API is unavailable'
      priority: HIGH
      description: 'The Zabbix server cannot reach or authenticate to the FusionCompute VRM API.'
      tags:
        - tag: scope
          value: availability
