            - uuid: 598cf744ad284cbaaadfb5bdd6221709
              name: 'Cluster [{#CLUSTER.NAME}]: DRS enabled'
              type: DEPENDENT
              key: 'fusioncompute.cluster.drs[{#CLUSTER.URN}]'
