          trigger_prototypes:
            - uuid: 552d328e9d854d518cedef0b3e407668
              expression: 'last(/Huawei FusionCompute by HTTP/fusioncompute.cluster.ha[{#CLUSTER.URN}])=0'
              name: 'Cluster [{#CLUSTER.NAME}]: HA is disabled'
