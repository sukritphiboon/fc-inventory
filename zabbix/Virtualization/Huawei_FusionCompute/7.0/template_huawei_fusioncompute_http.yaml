                formulaid: B
          item_prototypes:
            - uuid: 86a45747666440008a23202ab1cbbc02
              name: 'Datastore [{#DS.NAME}]: Capacity'
              type: DEPENDENT
              key: 'fusioncompute.datastore.capacity[{#DS.URN}]'
