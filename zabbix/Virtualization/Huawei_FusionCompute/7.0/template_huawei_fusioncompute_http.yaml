            - uuid: 31627845ea084e24892e21e29c45250e
              name: 'Datastore [{#DS.NAME}]: Status'
              type: DEPENDENT
              key: 'fusioncompute.datastore.status[{#DS.URN}]'
              value_type: UNSIGNED
              valuemap:
                name: 'FusionCompute datastore status'
              master_item:
                key: fusioncompute.datastores
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.urn=="{#DS.URN}")].status.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: unknown
                - type: JAVASCRIPT
                  parameters:
                    - "return (value.toUpperCase() === 'NORMAL') ? 1 : 0;"
              tags:
                - tag: component
                  value: datastore
                - tag: datastore
                  value: '{#DS.NAME}'
          trigger_prototypes:
            - uuid: ce26979cc71847f29a7c73644aef2d40
              expression: 'min(/Huawei FusionCompute by HTTP/fusioncompute.datastore.pused[{#DS.URN}],15m)>{$FC.DATASTORE.PUSED.MAX.WARN:"{#DS.NAME}"}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Huawei FusionCompute by HTTP/fusioncompute.datastore.pused[{#DS.URN}],15m)<{$FC.DATASTORE.PUSED.MAX.WARN:"{#DS.NAME}"}'
              name: 'Datastore [{#DS.NAME}]: Space usage is high (>{$FC.DATASTORE.PUSED.MAX.WARN:"{#DS.NAME}"}%)'
              priority: WARNING
              dependencies:
                - name: 'Datastore [{#DS.NAME}]: Space usage is critical (>{$FC.DATASTORE.PUSED.MAX.CRIT:"{#DS.NAME}"}%)'
                  expression: 'min(/Huawei FusionCompute by HTTP/fusioncompute.datastore.pused[{#DS.URN}],15m)>{$FC.DATASTORE.PUSED.MAX.CRIT:"{#DS.NAME}"}'
                  recovery_expression: 'max(/Huawei FusionCompute by HTTP/fusioncompute.datastore.pused[{#DS.URN}],15m)<{$FC.DATASTORE.PUSED.MAX.CRIT:"{#DS.NAME}"}'
              tags:
                - tag: scope
                  value: capacity
            - uuid: 24af73cad2f44c38af5ca04656498ef2
              expression: 'min(/Huawei FusionCompute by HTTP/fusioncompute.datastore.pused[{#DS.URN}],15m)>{$FC.DATASTORE.PUSED.MAX.CRIT:"{#DS.NAME}"}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Huawei FusionCompute by HTTP/fusioncompute.datastore.pused[{#DS.URN}],15m)<{$FC.DATASTORE.PUSED.MAX.CRIT:"{#DS.NAME}"}'
              name: 'Datastore [{#DS.NAME}]: Space usage is critical (>{$FC.DATASTORE.PUSED.MAX.CRIT:"{#DS.NAME}"}%)'
              priority: HIGH
              tags:
                - tag: scope
                  value: capacity
        - uuid: ee9abdf821574b9c897d71e42f59fd0d
          name: 'Cluster discovery'
