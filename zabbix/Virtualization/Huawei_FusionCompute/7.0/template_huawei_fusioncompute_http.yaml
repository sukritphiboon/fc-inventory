              expression: 'last(/Huawei FusionCompute by HTTP/fusioncompute.host.status[{#HOST.URN}])<>1'
              name: 'Host [{#HOST.NAME}]: Status is not normal'
              priority: WARNING
              description: 'The FusionCompute host is not in the normal state.'
              tags:
                - tag: scope
                  value: availability
        - uuid: ecc8f01d78534cdeb4b64b8c73766d31
          name: 'VM discovery'
          type: DEPENDENT
          key: fusioncompute.vm.discovery
          delay: '0'
          description: 'Discovers virtual machines reported by FusionCompute.'
          master_item:
            key: fusioncompute.vms
          lld_macro_paths:
            - lld_macro: '{#VM.NAME}'
              path: $.name
            - lld_macro: '{#VM.URN}'
              path: $.urn
            - lld_macro: '{#VM.UUID}'
              path: $.uuid
          filter:
            evaltype: AND
            conditions:
              - macro: '{#VM.NAME}'
                value: '{$FC.LLD.FILTER.VM.MATCHES}'
                formulaid: A
              - macro: '{#VM.NAME}'
                value: '{$FC.LLD.FILTER.VM.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          item_prototypes:
            - uuid: 5f39f4416b8245aea02402a892b372c7
              name: 'VM [{#VM.NAME}]: Power state'
              type: DEPENDENT
              key: 'fusioncompute.vm.power[{#VM.URN}]'
              value_type: UNSIGNED
              valuemap:
                name: 'FusionCompute VM power state'
              master_item:
                key: fusioncompute.vms
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.urn=="{#VM.URN}")].status.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: unknown
                - type: JAVASCRIPT
                  parameters:
                    - "return (value.toLowerCase() === 'running') ? 1 : 0;"
              tags:
                - tag: component
                  value: vm
                - tag: vm
                  value: '{#VM.NAME}'
            - uuid: 550db5559cb64887ba120a94942389d0
              name: 'VM [{#VM.NAME}]: vCPUs'
              type: DEPENDENT
              key: 'fusioncompute.vm.cpus[{#VM.URN}]'
              value_type: UNSIGNED
              master_item:
                key: fusioncompute.vms
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.urn=="{#VM.URN}")].cpus.first()'
              tags:
                - tag: component
                  value: vm
                - tag: vm
                  value: '{#VM.NAME}'
            - uuid: 66d21f8c90de454a8e6220c110b50d39
              name: 'VM [{#VM.NAME}]: Memory'
              type: DEPENDENT
              key: 'fusioncompute.vm.memory[{#VM.URN}]'
              value_type: UNSIGNED
              units: B
              master_item:
                key: fusioncompute.vms
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.urn=="{#VM.URN}")].memMB.first()'
                - type: MULTIPLIER
                  parameters:
                    - '1048576'
              tags:
                - tag: component
                  value: vm
                - tag: vm
                  value: '{#VM.NAME}'
          trigger_prototypes:
            - uuid: 21e636a6945e4d0e92ef2faa0892a570
              expression: 'last(/Huawei FusionCompute by HTTP/fusioncompute.vm.power[{#VM.URN}])=0'
              name: 'VM [{#VM.NAME}]: Powered off'
              priority: INFO
              status: DISABLED
              manual_close: 'YES'
              description: 'The virtual machine is not running. Disabled by default - enable per VM as needed.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 1272097773974e9c9fe26dbc0e9dbe95
          name: 'Datastore discovery'
          type: DEPENDENT
          key: fusioncompute.datastore.discovery
          delay: '0'
          description: 'Discovers datastores reported by FusionCompute.'
          master_item:
            key: fusioncompute.datastores
          lld_macro_paths:
            - lld_macro: '{#DS.NAME}'
              path: $.name
            - lld_macro: '{#DS.URN}'
              path: $.urn
