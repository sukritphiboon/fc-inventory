zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: dcb6e301283e4be6859027bf817a34d1
      name: Templates/Virtualization
  templates:
    - uuid: 09b958d80b1c40a2ac237a78e48fb68b
      template: 'Huawei FusionCompute by HTTP'
      name: 'Huawei FusionCompute by HTTP'
      description: |
        Monitoring of Huawei FusionCompute (VRM REST API) over HTTP using Zabbix Script items.
        Each Script item logs in to the VRM, fetches one resource list (with pagination), and
        returns JSON that is parsed by dependent items and low-level discovery rules.

        Requires Zabbix 6.0+ (Script item type). Tested layout for Zabbix 7.0 LTS.

        Set the macros {$FC.HOST}, {$FC.USER} and {$FC.PASSWORD} on the host before linking.

        Template author: fc-inventory project (https://github.com/sukritphiboon/fc-inventory)
      groups:
        - name: Templates/Virtualization
      items:
        - uuid: d9a15be26b7e463daada984711800002
          name: 'FusionCompute: Get hosts'
          type: SCRIPT
          key: fusioncompute.hosts
          history: '0'
          trends: '0'
          value_type: TEXT
          params: |
            var p = JSON.parse(value);
            var base = 'https://' + p.host + ':' + p.port + '/service';

            function sha256(ascii) {
                function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
                var mathPow = Math.pow;
                var maxWord = mathPow(2, 32);
                var result = '';
                var words = [];
                var asciiBitLength = ascii.length * 8;
                var hash = sha256.h = sha256.h || [];
                var k = sha256.k = sha256.k || [];
                var primeCounter = k.length;
                var isComposite = {};
                for (var candidate = 2; primeCounter < 64; candidate++) {
                    if (!isComposite[candidate]) {
                        for (var i = 0; i < 313; i += candidate) { isComposite[i] = candidate; }
                        hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
                        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
                    }
                }
                ascii += '\x80';
                while (ascii.length % 64 - 56) ascii += '\x00';
                for (i = 0; i < ascii.length; i++) {
                    var j = ascii.charCodeAt(i);
                    if (j >> 8) return '';
                    words[i >> 2] |= j << ((3 - i) % 4) * 8;
                }
                words[words.length] = ((asciiBitLength / maxWord) | 0);
                words[words.length] = (asciiBitLength);
                for (j = 0; j < words.length;) {
                    var w = words.slice(j, j += 16);
                    var oldHash = hash;
                    hash = hash.slice(0, 8);
                    for (i = 0; i < 64; i++) {
                        var w15 = w[i - 15], w2 = w[i - 2];
                        var a = hash[0], e = hash[4];
                        var temp1 = hash[7]
                            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                            + ((e & hash[5]) ^ ((~e) & hash[6]))
                            + k[i]
                            + (w[i] = i < 16 ? w[i] : (
                                w[i - 16]
                                + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                                + w[i - 7]
                                + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                            ) | 0);
                        var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                            + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                        hash = [(temp1 + temp2) | 0].concat(hash);
                        hash[4] = (hash[4] + temp1) | 0;
                    }
                    for (i = 0; i < 8; i++) { hash[i] = (hash[i] + oldHash[i]) | 0; }
                }
                for (i = 0; i < 8; i++) {
                    for (j = 3; j + 1; j--) {
                        var b = (hash[i] >> (j * 8)) & 255;
                        result += ((b < 16) ? 0 : '') + b.toString(16);
                    }
                }
                return result;
            }

            function abs(path) {
                if (path.indexOf('http') === 0) return path;
                if (path.indexOf('/service') === 0) return 'https://' + p.host + ':' + p.port + path;
                return base + path;
            }

            function login() {
                var versions = [p.apiVersion, 'v8.0', 'v6.5', 'v6.3', 'v6.1', 'v1.0', 'v9.0'];
                var tried = {};
                var lastErr = '';
                for (var i = 0; i < versions.length; i++) {
                    var ver = versions[i];
                    if (!ver || tried[ver]) continue;
                    tried[ver] = true;
                    var req = new HttpRequest();
                    req.addHeader('Content-Type: application/json; charset=UTF-8');
                    req.addHeader('Accept: application/json;version=' + ver + ';charset=UTF-8');
                    req.addHeader('X-Auth-User: ' + p.user);
                    req.addHeader('X-Auth-UserType: 0');
                    if (p.authMode === 'sha256') {
                        req.addHeader('X-Auth-Key: ' + sha256(p.password));
                        req.addHeader('X-ENCRYPT-ALGORITHM: 0');
                    } else {
                        req.addHeader('X-Auth-Key: ' + p.password);
                        req.addHeader('X-ENCRYPT-ALGORITHM: 1');
                    }
                    var resp = req.post(base + '/session', '');
                    var st = req.getStatus();
                    if (st === 200) {
                        var token = null;
                        var hdrs = req.getHeaders();
                        if (hdrs) {
                            for (var hk in hdrs) {
                                if (hk.toLowerCase() === 'x-auth-token') { token = hdrs[hk]; break; }
                            }
                        }
                        if (!token) { try { var b = JSON.parse(resp); token = b.accessSession || b.token; } catch (e) {} }
                        if (token) return { token: token, version: ver };
                        lastErr = 'login HTTP 200 but no X-Auth-Token returned';
                    } else {
                        lastErr = 'HTTP ' + st + ' ' + (resp ? resp.substring(0, 120) : '');
                        if (resp && resp.indexOf('10000022') >= 0) continue;
                    }
                }
                throw 'FusionCompute login failed: ' + lastErr;
            }

            function apiGet(sess, path) {
                var req = new HttpRequest();
                req.addHeader('Content-Type: application/json; charset=UTF-8');
                req.addHeader('Accept: application/json;version=' + sess.version + ';charset=UTF-8');
                req.addHeader('X-Auth-Token: ' + sess.token);
                var resp = req.get(abs(path));
                if (req.getStatus() !== 200) throw 'GET ' + path + ' failed: HTTP ' + req.getStatus();
                return JSON.parse(resp);
            }

            function getAll(sess, path, key) {
                var items = [];
                var offset = 0;
                var limit = 100;
                while (true) {
                    var sep = path.indexOf('?') >= 0 ? '&' : '?';
                    var data = apiGet(sess, path + sep + 'offset=' + offset + '&limit=' + limit);
                    if (Array.isArray(data)) return data;
                    var batch = data[key] || data.items || data.result || [];
                    if (!batch || !batch.length) break;
                    items = items.concat(batch);
                    var total = (typeof data.total === 'number') ? data.total : items.length;
                    if (items.length >= total) break;
                    offset += limit;
                }
                return items;
            }

            function firstSite(sess) {
                var d = apiGet(sess, '/sites');
                var sites = d.sites || d.items || [];
                if (!sites.length) throw 'no sites returned by /sites';
                return sites[0].uri;
            }

            var sess = login();
            var site = firstSite(sess);
            var out = [];

            if (p.resource === 'hosts') {
                var hosts = getAll(sess, site + '/hosts', 'hosts');
                for (var i = 0; i < hosts.length; i++) {
                    var h = hosts[i];
                    var d = h;
                    try { if (h.uri) d = apiGet(sess, h.uri); } catch (e) {}
                    out.push({
                        name: d.name, urn: d.urn || h.urn, ip: d.ip || '',
                        status: d.status || '',
                        cpuCores: d.cpuQuantity || d.cpuCores || 0,
                        cpuMHz: d.cpuMHz || d.cpuFrequency || 0,
                        memTotalMB: d.memoryQuantityMB || d.memoryCapacity || 0,
                        memUsedMB: d.memoryUsedMB || 0,
                        runningVmCount: d.runningVmCount || 0
                    });
                }
            } else if (p.resource === 'vms') {
                var vms = getAll(sess, site + '/vms', 'vms');
                for (var j = 0; j < vms.length; j++) {
                    var v = vms[j];
                    var cfg = v.vmConfig || {};
                    out.push({
                        name: v.name, urn: v.urn, uuid: v.uuid || '',
                        status: v.status || '',
                        cpus: (cfg.cpu && cfg.cpu.quantity) || 0,
                        memMB: (cfg.memory && cfg.memory.quantityMB) || 0
                    });
                }
            } else if (p.resource === 'datastores') {
                var ds = getAll(sess, site + '/datastores', 'datastores');
                for (var k = 0; k < ds.length; k++) {
                    var s = ds[k];
                    var cap = s.capacityGB || (s.capacityMB ? s.capacityMB / 1024 : 0) || 0;
                    var free = s.freeSpaceGB || s.freeCapacityGB || s.freeSizeGB || 0;
                    out.push({
                        name: s.name, urn: s.urn, status: s.status || '',
                        storageType: s.storageType || '',
                        capacityGB: cap, freeGB: free,
                        usedPct: cap > 0 ? Math.round((cap - free) / cap * 10000) / 100 : 0
                    });
                }
            } else if (p.resource === 'clusters') {
                var cl = getAll(sess, site + '/clusters', 'clusters');
                for (var m = 0; m < cl.length; m++) {
                    var c = cl[m];
                    out.push({
                        name: c.name, urn: c.urn,
                        haEnabled: c.isEnableHa ? 1 : 0,
                        drsEnabled: c.isEnableDrs ? 1 : 0
                    });
                }
            } else if (p.resource === 'summary') {
                var allVms = getAll(sess, site + '/vms', 'vms');
                var allHosts = getAll(sess, site + '/hosts', 'hosts');
                var up = 0, down = 0;
                for (var n = 0; n < allVms.length; n++) {
                    if ((allVms[n].status || '').toLowerCase() === 'running') up++; else down++;
                }
                out = { available: 1, totalVms: allVms.length, runningVms: up, stoppedVms: down, totalHosts: allHosts.length };
            }

            try { var lo = new HttpRequest(); lo.addHeader('X-Auth-Token: ' + sess.token); lo.delete(base + '/session', ''); } catch (e) {}

            return JSON.stringify(out);
          parameters:
            - name: host
              value: '{$FC.HOST}'
            - name: port
              value: '{$FC.PORT}'
            - name: user
              value: '{$FC.USER}'
            - name: password
              value: '{$FC.PASSWORD}'
            - name: apiVersion
              value: '{$FC.API.VERSION}'
            - name: authMode
              value: '{$FC.AUTH.MODE}'
            - name: resource
              value: hosts
          timeout: '{$FC.DATA.TIMEOUT}'
          delay: 5m
          tags:
            - tag: component
              value: raw
